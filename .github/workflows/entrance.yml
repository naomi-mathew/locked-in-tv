name: Entrance screen data

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: entrance-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull classes and shout-outs from Mariana Tek
        env:
          MT_TOKEN: ${{ secrets.MT_TOKEN }}
        run: python scripts/entrance_data.py 2
      - name: Publish if anything changed
        run: |
          git config user.name "entrance-screen-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entrance/data.json
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Entrance screen: refresh bookings"
          git push
