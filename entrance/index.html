:root{
  --wall:#141413; --text:#ffffff; --soft:rgba(255,255,255,.66); --grey:#8f8f8a; --line:rgba(255,255,255,.12);
  --orange:#FF6907;
  --font:"Satoshi","Manrope",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--wall);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:48px 72px}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}
h1{font-size:clamp(32px,4.6vw,52px);font-weight:500;letter-spacing:-.04em;line-height:1.02;margin:10px 0 16px;text-wrap:balance}
h2{font-size:clamp(24px,3vw,32px);font-weight:500;letter-spacing:-.03em;line-height:1.05;margin:0 0 18px}
p{margin:0;max-width:66ch;color:var(--soft)}
.lead{font-size:18px}

.switch{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.switch span{font-size:14px;color:var(--grey);margin-right:6px}
.switch button{font:500 15px var(--font);color:var(--text);background:transparent;border:1px solid var(--line);border-radius:8px;padding:11px 16px;cursor:pointer}
.switch button[aria-pressed="true"]{background:var(--text);color:#121212;border-color:var(--text)}
.switch button:focus-visible{outline:2px solid var(--text);outline-offset:3px}

.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 32px;max-width:880px}
.gallery.three{grid-template-columns:repeat(3,minmax(0,1fr));max-width:1000px;gap:28px}
@media (max-width:900px){.gallery.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.gallery{grid-template-columns:minmax(0,1fr)}.gallery figure{max-width:420px;width:100%;margin-inline:auto}}
figure{margin:0;display:flex;flex-direction:column;gap:14px;min-width:0}
figcaption{display:flex;flex-direction:column;gap:4px}
figcaption b{font-weight:500;font-size:18px}
figcaption span{font-size:14px;color:var(--soft)}
.bezel{background:#000;border-radius:14px;padding:10px;border:1px solid #262624}

/* ---------- the screen ---------- */
.tv{--bg:#242422;--bg2:#1b1b1a;--fg:#ffffff;--fs:rgba(255,255,255,.64);--fg3:#8f8f8a;--hl:rgba(255,255,255,.12);--band:#2e2e2b;--bfg:#ffffff;--bfs:rgba(255,255,255,.6);--bline:rgba(255,255,255,.12);
  position:relative;aspect-ratio:9/16;width:100%;max-width:100%;overflow:hidden;border-radius:4px;
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);color:var(--fg);container-type:inline-size;font-family:var(--font)}
.tv.mist{--bg:#f4f4f2;--bg2:#ececea;--fg:#121212;--fs:#5e5e5b;--fg3:#7a7a76;--hl:#dcdcd7;--band:#121212;--bfg:#ffffff;--bfs:rgba(255,255,255,.62);--bline:rgba(255,255,255,.14)}
.tv canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.tv .in{position:absolute;inset:0;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:7cqw 7cqw 0}
.logo{height:5.4cqw;width:auto;display:block}
.clock{font-size:3.8cqw;font-weight:500;font-variant-numeric:tabular-nums;color:var(--fs)}
.sample{position:absolute;bottom:1.4cqw;left:50%;transform:translateX(-50%);z-index:4;font-size:1.9cqw;letter-spacing:.12em;text-transform:uppercase;color:var(--bfs);opacity:.7}

.stage{position:relative;flex:1;margin:0 7cqw}
.bars{position:absolute;top:8cqw;left:0;right:0;display:flex;gap:1.6cqw}
.bars i{flex:1;height:.5cqw;border-radius:1cqw;background:var(--hl);overflow:hidden;position:relative}
.bars i b{position:absolute;inset:0;background:var(--fg);transform-origin:left;transform:scaleX(0)}
.bars i.done b{transform:scaleX(1)}
.bars i.run b{animation:fill var(--dur,10s) linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
.slide{position:absolute;left:0;right:0;top:15cqw;bottom:6cqw;display:flex;flex-direction:column;opacity:0;transform:translateY(2.5cqw);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.slide.on{opacity:1;transform:none}
.ey{font-size:2.5cqw;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--fg3)}
.slide.qt h3{font-size:13cqw;margin-top:auto;margin-bottom:auto}
.slide.qt .note{margin-top:0}
.slide h3{font-size:10.5cqw;font-weight:500;letter-spacing:-.045em;line-height:.98;margin:3.2cqw 0 0;text-wrap:balance}
.rows{margin-top:auto;display:flex;flex-direction:column}
.ms{display:grid;grid-template-columns:30cqw 1fr;align-items:baseline;gap:3cqw;padding:4cqw 0 3.4cqw;border-top:1px solid var(--hl)}
.ms .n{font-size:15cqw;font-weight:500;letter-spacing:-.05em;line-height:.85;font-variant-numeric:tabular-nums}
.ms .n small{font-size:6cqw;letter-spacing:-.02em;margin-left:1cqw}
.ms .who{display:flex;flex-direction:column;gap:.6cqw}
.ms .who b{font-size:6.2cqw;font-weight:500;letter-spacing:-.03em;line-height:1}
.ms .who span{font-size:3cqw;color:var(--fs)}
.names{margin-top:5cqw;display:flex;flex-direction:column}
.names div{font-size:11cqw;font-weight:500;letter-spacing:-.045em;line-height:1.05;padding:2.6cqw 0;border-top:1px solid var(--hl)}
.note{font-size:3.6cqw;color:var(--fs);margin-top:auto;line-height:1.4;max-width:70cqw}
.slide.on .stag{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(2.5cqw)}}

/* timer band */
.band{background:var(--band);color:var(--bfg);padding:6cqw 7cqw 8cqw;display:flex;flex-direction:column;gap:3cqw;position:relative;z-index:2}
.band .lab{display:flex;justify-content:space-between;align-items:center;font-size:2.5cqw;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--bfs)}
.band [data-lab].soon{font-size:4.2cqw;letter-spacing:-.01em;text-transform:none;color:var(--bfg)}
.band .cls em:empty{display:none}
.band .live{display:inline-flex;align-items:center;gap:1.4cqw;letter-spacing:.06em;text-transform:none;font-size:2.8cqw}
.band .live i{width:1.6cqw;height:1.6cqw;border-radius:50%;background:var(--orange)}
.band .row{display:flex;justify-content:space-between;align-items:flex-end;gap:4cqw}
.band .cls{min-width:0}
.band .cls em{display:block;font-style:normal;font-size:3.2cqw;color:var(--bfs);font-variant-numeric:tabular-nums;margin-bottom:1cqw}
.band .cls b{display:block;font-size:6.4cqw;font-weight:500;letter-spacing:-.03em;line-height:1.05}
.band .cls span{font-size:3.2cqw;color:var(--bfs)}
.band .cd{text-align:right}
.band .cd b{display:block;font-size:13cqw;font-weight:500;letter-spacing:-.05em;line-height:.85;font-variant-numeric:tabular-nums}
.band .cd span{font-size:2.6cqw;color:var(--bfs);letter-spacing:.12em;text-transform:uppercase}
.band .track{height:.5cqw;border-radius:1cqw;background:var(--bline);overflow:hidden}
.band .track i{display:block;height:100%;background:var(--bfg);width:0;transition:width 1s linear}

.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
@media (max-width:900px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.opts{grid-template-columns:minmax(0,1fr)}}
.opts>div{min-width:0;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px}
.ey2{font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--grey)}
.pick{font-size:22px;font-weight:500;letter-spacing:-.02em;line-height:1.15;color:var(--text)}
.opts em{font-style:normal;color:var(--grey)}
.opts ul{gap:6px;font-size:15px}
.opts ul.plain{list-style:none;padding:0}
.opts ul.plain b{display:inline-block;min-width:3.4em;color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- orange pop variants ---------- */
.tv .grad,.grad{background:linear-gradient(100deg,#FF6907 0%,#ff8a2b 45%,#ffb36b 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tv.mist .grad{background:linear-gradient(100deg,#e85a00 0%,#FF6907 50%,#ff8a2b 100%);-webkit-background-clip:text;background-clip:text}
.fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.fx i{position:absolute;border-radius:50%;display:block}
.tv .in{z-index:1}
.tv .band{z-index:2}
/* 1 ember */
@keyframes emb1{to{transform:translate(28cqw,18cqw) scale(1.08)}}
@keyframes emb2{to{transform:translate(-18cqw,-14cqw)}}
/* 2 horizon */
@keyframes hz{from{opacity:.75;transform:scaleX(.92)}to{opacity:1;transform:scaleX(1.05)}}
/* 3 gear */
@keyframes gspin{to{transform:rotate(360deg)}}
/* 4 light */

/* ---------- v08: theme switch + marks ---------- */
.tv{background:#1d1d1c;transition:color .9s ease}
.tv *{transition-property:color,border-color,opacity,transform,background-color;transition-duration:.9s}
.tv .slide{transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.bgs,.bgs i{position:absolute;inset:0;display:block}
.bgs .bd{background:linear-gradient(180deg,#262624 0%,#1b1b1a 100%)}
.bgs .bm{background:linear-gradient(180deg,#f6f5f2 0%,#eeece8 100%);opacity:0;transition:opacity 1.1s ease}
.tv.mist .bgs .bm{opacity:1}
.logos{position:relative;display:block}
.logos .lb{position:absolute;left:0;top:0;opacity:0}
.tv.mist .logos .lb{opacity:1}.tv.mist .logos .lw{opacity:0}
.tv .band,.tv.mist .band{--band:#161413;background:linear-gradient(160deg,#2a211b 0%,#161514 55%)}
.tv .band{--bfg:#fff;--bfs:rgba(255,255,255,.62);--bline:rgba(255,255,255,.14);color:#fff}
.glowA,.glowB{position:absolute;border-radius:50%;pointer-events:none;transition:opacity 1.1s}
.glowA{width:130cqw;height:130cqw;right:-60cqw;top:-10cqw;background:radial-gradient(circle,rgba(255,105,7,.38) 0%,rgba(255,130,50,.14) 40%,rgba(255,130,50,0) 66%);animation:gbreath 9s ease-in-out infinite alternate}
.glowB{width:110cqw;height:110cqw;left:-60cqw;top:75cqw;background:radial-gradient(circle,rgba(255,170,110,.22),rgba(255,170,110,0) 62%)}
.tv.mist .glowA{background:radial-gradient(circle,rgba(255,105,7,.30) 0%,rgba(255,160,90,.16) 38%,rgba(255,160,90,0) 66%)}
@keyframes gbreath{from{opacity:.75;transform:scale(.96)}to{opacity:1;transform:scale(1.04)}}
.mark{position:absolute;aspect-ratio:600/493;pointer-events:none}
.mark .sw{position:absolute;inset:0;width:100%;height:100%;display:block}
.mark .gearsvg{position:absolute;left:-4.6%;top:-4.3%;width:89.1%;height:auto;aspect-ratio:1;fill:rgba(255,255,255,.075);transition:fill 1s}
.tv.mist .mark .gearsvg{fill:rgba(18,18,18,.07)}

  background:linear-gradient(100deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 60%);background-size:300% 100%;background-position:100% 0;animation:shine 7s ease-in-out infinite}
@keyframes shine{0%,55%{background-position:100% 0}100%{background-position:-50% 0}}
/* A: turning gear */
.v-turn .mark{width:118cqw;right:-50cqw;top:17cqw}
.v-turn .gearsvg{animation:gspin 120s linear infinite}
.v-turn .sw{opacity:.45}
.v-turn .shine{display:none}
/* B: swoosh only */
.v-swoosh .gearsvg{display:none}
.v-swoosh .mark{width:200cqw;left:-62cqw;top:38cqw}
.v-swoosh .sw{opacity:.34}
.tv.mist.v-swoosh .sw{opacity:.42}
.v-swoosh .shine{opacity:.5}
.v-swoosh .mark.draw .sw,.v-swoosh .mark.draw .shine{animation-name:drawin,shine;animation-duration:1.8s,7s;animation-timing-function:cubic-bezier(.3,.7,.2,1),ease-in-out;animation-iteration-count:1,infinite}
.v-swoosh .mark.draw .sw{animation:drawin 1.8s cubic-bezier(.3,.7,.2,1) both}
@keyframes drawin{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes gspin{to{transform:rotate(360deg)}}

/* 1: tick */
.v-tick .mark{width:118cqw;right:-50cqw;top:17cqw}
.v-tick .sw{opacity:.45}
.v-tick .shine{display:none}
.v-tick .gearsvg{transition:transform .55s cubic-bezier(.3,1.6,.5,1),fill 1s}
.v-tick .glowA.pulse{animation:tpulse 1.2s ease-out}
@keyframes tpulse{0%{opacity:1;transform:scale(1)}25%{opacity:1;transform:scale(1.1);filter:brightness(1.35)}100%{opacity:1;transform:scale(1)}}
.v-tick .glowA{animation:none;opacity:1}
/* 2: light only */
.v-glow .mark{display:none}
.v-glow .glowA{width:150cqw;height:150cqw;right:-70cqw;top:-30cqw;animation:pool1 16s ease-in-out infinite alternate}
.v-glow .glowB{width:140cqw;height:140cqw;left:-75cqw;top:60cqw;background:radial-gradient(circle,rgba(255,150,80,.34),rgba(255,170,110,.12) 40%,rgba(255,170,110,0) 66%);animation:pool2 21s ease-in-out infinite alternate}
.tv.mist.v-glow .glowB{background:radial-gradient(circle,rgba(255,140,70,.28),rgba(255,180,130,.12) 40%,rgba(255,180,130,0) 66%)}
@keyframes pool1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-22cqw,22cqw) scale(1.12)}100%{transform:translate(-8cqw,48cqw) scale(.95)}}
@keyframes pool2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30cqw,-20cqw) scale(1.1)}100%{transform:translate(18cqw,-44cqw) scale(1)}}
.gallery.solo{grid-template-columns:minmax(0,440px);justify-content:start}
.tv canvas.silk{z-index:0}
.has-silk .glowA,.has-silk .glowB{display:none}
/* notes */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.cols>div{min-width:0;border-top:1px solid var(--line);padding-top:20px}
.cols h4{font-size:20px;font-weight:500;letter-spacing:-.02em;margin:0 0 12px}
ol,ul{margin:0;padding-left:20px;color:var(--soft);display:flex;flex-direction:column;gap:10px}
li b{color:var(--text);font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html,body{height:100%;margin:0;padding:0!important;overflow:hidden;background:#1b1b1a}
.tv.live{position:fixed;inset:0;width:100vw;height:100vh;aspect-ratio:auto;border-radius:0;max-width:none}
.tv.live .sample{display:none}
/* Portrait TV fed a landscape window (AbleSign doesn't rotate websites): turn the page. ?rot=90 or -90; default 0 (no turn) */
html.rot90 .tv.live,html.rot-90 .tv.live{width:100vh;height:100vw;inset:auto;top:0;left:0}
html.rot90 .tv.live{transform-origin:top left;transform:rotate(90deg) translateY(-100%)}
html.rot-90 .tv.live{transform-origin:top left;transform:rotate(-90deg) translateX(-100%)}
.sl{margin-top:auto;display:flex;flex-direction:column}
.sr{display:grid;grid-template-columns:24cqw 1fr auto;align-items:baseline;gap:3cqw;padding:3.2cqw 0;border-top:1px solid var(--hl)}
.sr .st{font-size:5cqw;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sr .sn{display:flex;flex-direction:column;gap:.6cqw;min-width:0}
.sr .sn b{font-size:5cqw;font-weight:500;letter-spacing:-.025em;line-height:1.05}
.sr .sn span{font-size:3cqw;color:var(--fs)}
.sr i{font-style:normal;font-size:2.3cqw;font-weight:500;letter-spacing:.14em;text-transform:uppercase;padding:.7cqw 1.6cqw;border-radius:99px;border:1px solid var(--hl);color:var(--fs);align-self:center}
[data-slide="sc"] .note{margin-top:5cqw}
.names small.ct{font-size:3.4cqw;font-weight:400;letter-spacing:0;color:var(--fs);margin-left:3cqw;vertical-align:middle}
/* plain backgrounds (9 Nov): nothing animates behind the text */
.tv .glowA,.tv .glowB,.tv .mark,.tv canvas.silk{display:none!important}
.bgs .bd{background:#232321}
.bgs .bm{background:#f2f1ee}
/* milestones: tighter layout when 3+ so up to 4 fit above the timer band */
.slide.dense h3{font-size:7.6cqw;margin-top:2.4cqw}
.slide.dense .ms{grid-template-columns:23cqw 1fr;padding:2.3cqw 0 1.9cqw}
.slide.dense .ms .n{font-size:11cqw}
.slide.dense .ms .n small{font-size:4.6cqw}
.slide.dense .ms .who b{font-size:5.4cqw}
.slide.dense .ms .who span{font-size:2.8cqw}
.fit{display:flex;flex-direction:column;min-height:100%;transform-origin:top left}
/* backgrounds: Ink (true black) instead of Graphite; timer band is Ink too, with a hairline on dark slides */
.bgs .bd{background:#121212}
.tv .band,.tv.mist .band{background:#121212}
.tv:not(.mist) .band{border-top:1px solid rgba(255,255,255,.14)}
/* ---------- v14 slides (10 Nov) ---------- */
.chips{display:flex;flex-wrap:wrap;gap:2cqw}
.chip{font-size:3.2cqw;font-weight:500;padding:1.4cqw 3cqw;border-radius:99px;border:1px solid var(--hl)}
.chip.hot{background:linear-gradient(100deg,#FF6907,#ffb36b);color:#121212;border-color:transparent}
.hyc{font-size:13cqw;font-weight:500;letter-spacing:-.055em;line-height:.92;margin-top:3.6cqw;text-wrap:balance}
.vibe{font-size:5cqw;line-height:1.25;margin-top:4cqw;color:var(--fs);max-width:80cqw}
.coachrow{display:flex;align-items:center;gap:3.6cqw;margin-top:auto;margin-bottom:5cqw}
.coachrow img{width:22cqw;height:22cqw;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 .8cqw #121212,0 0 0 1.2cqw rgba(255,255,255,.18);background:#2a2a28}
.coachrow b{display:block;font-size:5.6cqw;font-weight:500;letter-spacing:-.02em}
.coachrow span{display:block;font-size:3.4cqw;color:var(--fs);margin-top:.6cqw}
.hychips{margin-bottom:2cqw}
.crew{display:grid;grid-template-columns:1fr 1fr;gap:0 4cqw;margin-top:4cqw}
.crew div{font-size:4.5cqw;font-weight:500;letter-spacing:-.02em;padding:1.8cqw 0;border-top:1px solid var(--hl);display:flex;align-items:center;gap:1.6cqw;white-space:nowrap;overflow:hidden}
.crew i{font-style:normal;font-size:2.1cqw;font-weight:700;letter-spacing:.08em;padding:.5cqw 1.4cqw;border-radius:99px;background:#121212;color:#fff}
.crew i.o{background:linear-gradient(100deg,#FF6907,#ffb36b);color:#121212}
.find{margin-top:auto;font-size:3.4cqw;color:var(--fs);padding-top:3cqw}
.pocard{flex:1;margin:2cqw 0 1cqw;border:1px solid var(--hl);border-radius:3cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6cqw 5cqw}
.pocard .pn{font-size:38cqw;font-weight:500;letter-spacing:-.07em;line-height:.8;font-variant-numeric:tabular-nums}
.pocard .pn small{font-size:12cqw;letter-spacing:-.03em;margin-left:1cqw}
.pocard .pw{font-size:4.4cqw;letter-spacing:.16em;text-transform:uppercase;font-weight:500;color:var(--fs);margin-top:4cqw}
.pocard .pp{font-size:11cqw;font-weight:500;letter-spacing:-.045em;margin-top:5cqw;line-height:1}
.pocard .pt{font-size:3.2cqw;color:var(--fs);margin-top:5cqw}
.lbrows{margin-top:4cqw;display:flex;flex-direction:column}
.lbrows div{display:grid;grid-template-columns:9cqw 1fr auto;align-items:baseline;padding:2.6cqw 0;border-top:1px solid var(--hl);font-size:5cqw;font-weight:500;letter-spacing:-.02em}
.lbrows div span:first-child{font-size:3.4cqw;color:var(--fs);font-variant-numeric:tabular-nums}
.lbrows div span:last-child{font-variant-numeric:tabular-nums}
.lbrows div.one{font-size:6.4cqw}
.lbrows div.one span:last-child{background:linear-gradient(100deg,#FF6907,#ffb36b);-webkit-background-clip:text;background-clip:text;color:transparent}
.lbcta{margin-top:auto;font-size:4.4cqw;font-weight:500;letter-spacing:-.02em;line-height:1.25;padding-top:4cqw}
.lbcta span{display:block;font-size:3.2cqw;font-weight:400;color:var(--fs);margin-top:1.2cqw}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0 5cqw;margin-top:6cqw}
.stats div{border-top:1px solid var(--hl);padding:3.4cqw 0 4cqw}
.stats b{display:block;font-size:17cqw;font-weight:500;letter-spacing:-.06em;line-height:.85;font-variant-numeric:tabular-nums}
.stats span{font-size:3.2cqw;color:var(--fs)}
/* final 5-minute takeover */
.take{position:absolute;inset:0;z-index:6;background:#121212;color:#fff;display:none;flex-direction:column;justify-content:center;padding:0 7cqw}
.tv.taking .take{display:flex}
.tv.taking canvas{visibility:hidden}
.take .ey{color:rgba(255,255,255,.55)}
.take .tk{font-size:34cqw;font-weight:500;letter-spacing:-.07em;line-height:.8;margin:6cqw 0;font-variant-numeric:tabular-nums}
.take .tgo{font-size:7cqw;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.take .ttrack{position:absolute;left:7cqw;right:7cqw;bottom:10cqw;height:1cqw;border-radius:1cqw;background:rgba(255,255,255,.12);overflow:hidden}
.take .ttrack i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF6907,#ffb36b);transition:width 1s linear}

    const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    const uR=gl.getUniformLocation(pr,'r'),uT=gl.getUniformLocation(pr,'t'),uL=gl.getUniformLocation(pr,'L');
    el.classList.add('has-silk');
    let L=el.classList.contains('mist')?1:0, last=0; const start=performance.now();
    function frame(now){
      if(now-last>32 || reduce){ last=now;
        const s=Math.min(devicePixelRatio||1,1.5)*.6, w=Math.round(cv.clientWidth*s), h=Math.round(cv.clientHeight*s);
        if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h);}
        const target=el.classList.contains('mist')?1:0; L+= (target-L)*.07;
        gl.uniform2f(uR,w,h);gl.uniform1f(uT,(now-start)/1000);gl.uniform1f(uL,L);
        gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
      }
      if(!reduce) requestAnimationFrame(frame); else setTimeout(()=>requestAnimationFrame(frame),1000);
    }
    requestAnimationFrame(frame);
  }
  // silk light removed 9 Nov: too laggy on the Reception TV; plain backgrounds instead

  // gear tick: one tooth (45deg) every 4 s
  if(!reduce){ let deg=0; setInterval(()=>{deg+=45; document.querySelectorAll('.v-tick').forEach(el=>{el.querySelector('.gearsvg').style.transform='rotate('+deg+'deg)'; const g=el.querySelector('.glowA'); g.classList.remove('pulse'); void g.offsetWidth; g.classList.add('pulse');});},4000); }
  tick(); setInterval(tick,1000);
})();
</script>
